[project]
name = "dnd-llm-game"
version = "0.1.0"
description = "A browser-based single-player DnD game where an LLM acts as the Dungeon Master."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "dspy>=3.2.1",
    "mlx-audio>=0.1.0; sys_platform == 'darwin'",
    "misaki>=0.1.0; sys_platform == 'darwin'",
]

[project.scripts]
backend = "app.serve:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "backend/app/tests"]
